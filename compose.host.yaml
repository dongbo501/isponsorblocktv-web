# Linux-only alternative for DIAL/SSDP and Chromecast/mDNS discovery.
# Use this file on its own: docker compose -f compose.host.yaml up -d
services:
  isponsorblocktv-web:
    image: ghcr.io/dongbo501/isponsorblocktv-web:latest
    container_name: isponsorblocktv-web
    restart: unless-stopped
    network_mode: host
    volumes:
      - isponsorblocktv-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  isponsorblocktv-data:
    name: isponsorblocktv-web-data
